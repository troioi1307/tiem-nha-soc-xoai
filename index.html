         * ========================================== */
        const State = {
            cart: JSON.parse(localStorage.getItem('sx_cart_pro')) || {},
            user: JSON.parse(localStorage.getItem('sx_user')) || { name: '', phone: '', address: '' },
            orderHistory: JSON.parse(localStorage.getItem('sx_history')) || [], // [NÂNG CẤP]
            searchQuery: '', // [NÂNG CẤP]
            lastAddedId: null, // Track flash anim
            isOffline: !navigator.onLine,
            
            saveCart: () => localStorage.setItem('sx_cart_pro', JSON.stringify(State.cart)),
            saveUser: () => localStorage.setItem('sx_user', JSON.stringify(State.user)),
            saveHistory: () => {
                if(State.orderHistory.length > 10) State.orderHistory.shift(); // Keep max 10
                localStorage.setItem('sx_history', JSON.stringify(State.orderHistory));
            },
            clearCart: () => { State.cart = {}; State.saveCart(); }
        };

        /** ==========================================
         * MODULE 4: UI CONTROLLER
         * ========================================== */
        const UI = {
            init: () => {
                UI.renderSkeletons();
                setTimeout(() => {
                    UI.renderMenu();
                    UI.updateCartBar();
                    UI.loadUserInfo();
                }, 400);
                UI.setupEvents();
                UI.checkTheme();
            },

            renderSkeletons: () => {
                let html = '';
                [1,2].forEach(i => {
                    html += `<div class="mb-8"><div class="h-8 w-48 skeleton rounded-lg mb-4"></div><div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">`;
                    [1,2,3,4].forEach(j => { html += `<div class="p-4 rounded-2xl border border-gray-100 dark:border-gray-800 flex justify-between"><div class="flex gap-3"><div class="w-10 h-10 skeleton rounded-full"></div><div class="space-y-2"><div class="w-24 h-4 skeleton rounded"></div><div class="w-16 h-4 skeleton rounded"></div></div></div></div>`; });
                    html += `</div></div>`;
                });
                document.getElementById('menu-container').innerHTML = html;
            },

            // [NÂNG CẤP] Có filter tìm kiếm
            renderMenu: () => {
                const container = document.getElementById('menu-container');
                const query = Utils.removeAccents(State.searchQuery);
                let html = '';
                let foundAny = false;

                CONFIG.MENU_DATA.forEach(category => {
                    const filteredItems = category.items.filter(item => Utils.removeAccents(item.name).includes(query));
                    if (filteredItems.length === 0) return;
                    foundAny = true;

                    html += `
                        <div class="mb-10">
                            <h3 class="text-2xl font-cute font-bold mb-4 border-b-2 border-primary/50 pb-2 dark:text-white">${category.category}</h3>
                            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                ${filteredItems.map(item => {
                                    // Data string for variant processing
                                    const variantStr = item.variants ? encodeURIComponent(JSON.stringify(item.variants)) : '';
                                    return `
                                    <div class="menu-card relative bg-white dark:bg-darkCard p-4 rounded-2xl border border-gray-100 dark:border-gray-800 shadow-sm flex justify-between items-center group">
                                        ${item.badge ? `<span class="absolute -top-2 -left-2 bg-red-500 text-white text-[10px] font-bold px-2 py-1 rounded-br-lg rounded-tl-lg shadow-md z-10">${item.badge}</span>` : ''}
                                        <div class="flex items-center gap-3 pr-2 flex-1">
                                            <div class="text-4xl group-hover:scale-110 transition-transform" id="icon-${item.id}">${item.icon}</div>
                                            <div>
                                                <div class="font-bold text-gray-800 dark:text-white leading-tight">${item.name}</div>
                                                <div class="text-secondary font-semibold text-sm mt-0.5">${item.displayPrice || Utils.formatMoney(item.price)}</div>
                                            </div>
                                        </div>
                                        <button class="btn-add-item touch-target bg-primary/20 hover:bg-secondary text-secondary hover:text-white w-10 h-10 rounded-full flex items-center justify-center font-bold text-xl transition-colors focus:outline-none shrink-0" 
                                                data-id="${item.id}" data-name="${item.name}" data-price="${item.price}" data-icon="${item.icon}" data-variants="${variantStr}">
                                            +
                                        </button>
                                    </div>
                                `}).join('')}
                            </div>
                        </div>
                    `;
                });

                if(!foundAny) html = `<div class="text-center py-10 text-gray-400 font-bold"><div class="text-5xl mb-2">😢</div>Không tìm thấy món nào!</div>`;
                container.innerHTML = html;
            },

            // [NÂNG CẤP] Modal chọn Size
            openVariantModal: (id, name, icon, variantsStr, btnElement) => {
                const variants = JSON.parse(decodeURIComponent(variantsStr));
                document.getElementById('var-icon').innerText = icon;
                document.getElementById('var-name').innerText = name;
                
                let optsHtml = '';
                variants.forEach((v, idx) => {
                    optsHtml += `
                    <label class="flex items-center justify-between p-3 border rounded-xl cursor-pointer hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors border-gray-200 dark:border-gray-700 touch-target has-[:checked]:border-secondary has-[:checked]:bg-primary/10">
                        <div class="flex items-center gap-2">
                            <input type="radio" name="var_opt" value="${idx}" class="w-5 h-5 text-secondary accent-secondary" ${idx===0 ? 'checked' : ''}>
                            <span class="font-bold dark:text-white">${v.v}</span>
                        </div>
                        <span class="text-secondary font-bold">${Utils.formatMoney(v.p)}</span>
                    </label>`;
                });
                document.getElementById('var-options').innerHTML = optsHtml;
                
                // Set action
                document.getElementById('btn-add-variant').onclick = () => {
                    const selectedIdx = document.querySelector('input[name="var_opt"]:checked').value;
                    const v = variants[selectedIdx];
                    CartController.add(`${id}_${selectedIdx}`, `${name} (${v.v})`, v.p, icon);
                    UI.closeVariantModal();
                    UI.flyToCartAnim(btnElement, icon);
                };

                document.getElementById('variant-overlay').classList.add('active');
                setTimeout(() => document.getElementById('variant-box').classList.add('active'), 10);
            },
            closeVariantModal: () => {
                document.getElementById('variant-box').classList.remove('active');
                setTimeout(() => document.getElementById('variant-overlay').classList.remove('active'), 300);
            },

            renderCartItems: () => {
                const list = document.getElementById('cart-items-list');
                if(Object.keys(State.cart).length === 0) {
                    list.innerHTML = `<div class="text-center py-8 opacity-50"><div class="text-5xl mb-2">🛒</div><p class="font-bold">Giỏ hàng trống trơn</p></div>`;
                    return;
                }

                let html = '';
                for (const [id, item] of Object.entries(State.cart)) {
                    // [NÂNG CẤP] Highlight flash nếu là món vừa thêm
                    const isNew = id === State.lastAddedId ? 'animate-flash-bg' : '';
                    html += `
                        <div class="flex justify-between items-center bg-white dark:bg-darkCard p-3 rounded-2xl border border-gray-100 dark:border-gray-800 shadow-sm ${isNew}">
                            <div class="flex items-center gap-3 flex-1 overflow-hidden">
                                <span class="text-3xl shrink-0">${item.icon}</span>
                                <div class="truncate pr-2">
                                    <div class="font-bold text-gray-800 dark:text-white text-sm truncate">${item.name}</div>
                                    <div class="text-secondary font-semibold text-xs">${Utils.formatMoney(item.price)}</div>
                                </div>
                            </div>
                            <div class="flex items-center gap-2 shrink-0">
                                <div class="flex items-center gap-1 bg-gray-50 dark:bg-gray-900 rounded-xl p-1 border border-gray-100 dark:border-gray-800">
                                    <button onclick="CartController.updateQty('${id}', -1)" class="w-8 h-8 rounded-lg flex items-center justify-center text-gray-500 hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors touch-target"><i class="fas fa-minus text-xs"></i></button>
                                    <input type="number" value="${item.qty}" onchange="CartController.setQty('${id}', this.value)" class="w-8 text-center font-bold bg-transparent border-none outline-none dark:text-white p-0 touch-target text-sm">
                                    <button onclick="CartController.updateQty('${id}', 1)" class="w-8 h-8 rounded-lg flex items-center justify-center text-secondary bg-primary/20 hover:bg-primary/40 transition-colors touch-target"><i class="fas fa-plus text-xs"></i></button>
                                </div>
                                <button onclick="CartController.removeItem('${id}')" class="w-8 h-8 rounded-lg flex items-center justify-center text-red-400 hover:bg-red-50 dark:hover:bg-red-900/20 transition-colors touch-target"><i class="fas fa-trash-alt text-sm"></i></button>
                            </div>
                        </div>
                    `;
                }
                list.innerHTML = html;
                State.lastAddedId = null; // Reset
            },

            updateCartBar: () => {
                let count = 0, total_k = 0;
                for (const id in State.cart) { count += State.cart[id].qty; total_k += State.cart[id].price * State.cart[id].qty; }

                // [NÂNG CẤP] Logic Freeship UI
                const bar = document.getElementById('sticky-cart');
                const badge = document.getElementById('cart-badge');
                const btnSubmit = document.getElementById('btn-submit-order');
                const hint = document.getElementById('freeship-hint');
                
                document.getElementById('cart-total-bar').innerText = Utils.formatMoney(total_k);
                badge.innerText = count;
                
                if(count > 0) {
                    bar.classList.remove('translate-y-full');
                    badge.classList.add('scale-125'); setTimeout(() => badge.classList.remove('scale-125'), 200);
                    
                    if(total_k >= CONFIG.FREESHIP_THRESHOLD) {
                        hint.innerHTML = `🎉 Tuyệt vời! Đã đạt <b>FREESHIP</b>`;
                        hint.className = "w-full bg-green-500/10 text-center text-xs font-bold py-1 text-green-600 transition-colors";
                        btnSubmit.classList.add('animate-shake-lite');
                    } else {
                        const delta = CONFIG.FREESHIP_THRESHOLD - total_k;
                        hint.innerHTML = `Mua thêm <b>${delta}k</b> để FREESHIP 🚀`;
                        hint.className = "w-full bg-primary/40 dark:bg-yellow-900/30 text-center text-xs font-bold py-1 text-secondary dark:text-yellow-400 transition-colors";
                        btnSubmit.classList.remove('animate-shake-lite');
                    }
                } else {
                    bar.classList.add('translate-y-full');
                    UI.closeCartModal();
                }

                // Update Modal values
                document.getElementById('cart-item-count').innerText = `${count} món`;
                document.getElementById('modal-food-val').innerText = Utils.formatMoney(total_k);
                
                const shipVal = parseInt(document.getElementById('frm-ship').value);
                const finalShip_k = total_k >= CONFIG.FREESHIP_THRESHOLD ? 0 : shipVal;
                
                const shipEl = document.getElementById('modal-ship-val');
                if(total_k >= CONFIG.FREESHIP_THRESHOLD && shipVal > 0) {
                    shipEl.innerHTML = `<span class="line-through text-gray-400 mr-1">${Utils.formatMoney(shipVal)}</span><span class="text-success">0đ</span>`;
                } else { shipEl.innerText = Utils.formatMoney(shipVal); }
                
                document.getElementById('modal-total-val').innerText = Utils.formatMoney(total_k + finalShip_k);
                btnSubmit.disabled = count === 0;

                UI.renderCartItems();
            },

            showToast: (msg, type = 'success') => {
                const container = document.getElementById('toast-container');
                const toast = document.createElement('div');
                const colors = { success: 'bg-green-600 text-white', error: 'bg-red-500 text-white', info: 'bg-gray-800 text-white' };
                const icons = { success: '<i class="fas fa-check-circle"></i>', error: '<i class="fas fa-exclamation-circle"></i>', info: '<i class="fas fa-info-circle"></i>' };
                
                toast.className = `toast-msg ${colors[type]} px-5 py-3 rounded-full shadow-2xl font-bold text-sm flex items-center gap-2 border border-white/10`;
                toast.innerHTML = `${icons[type]} ${msg}`;
                
                container.appendChild(toast);
                Utils.playSound(type === 'success' ? 'sound-pop' : '');
                
                setTimeout(() => { toast.style.opacity = '0'; toast.style.transform = 'translateY(-20px)'; setTimeout(() => toast.remove(), 300); }, 2500);
            },

            toggleCartModal: (forceClose = false) => {
                const overlay = document.getElementById('cart-overlay');
                const sheet = document.getElementById('cart-sheet');
                if(forceClose || overlay.classList.contains('active')) {
                    sheet.classList.remove('active'); setTimeout(() => overlay.classList.remove('active'), 300);
                } else {
                    if(Object.keys(State.cart).length === 0) { UI.showToast("Giỏ hàng đang trống", "info"); return; }
                    UI.updateCartBar(); overlay.classList.add('active'); setTimeout(() => sheet.classList.add('active'), 10);
                }
            },
            closeCartModal: () => UI.toggleCartModal(true),

            showConfirmClear: () => {
                document.getElementById('confirm-overlay').classList.add('active');
                setTimeout(() => document.getElementById('confirm-box').classList.add('active'), 10);
            },
            closeConfirm: () => {
                document.getElementById('confirm-box').classList.remove('active');
                setTimeout(() => document.getElementById('confirm-overlay').classList.remove('active'), 300);
            },

            // [NÂNG CẤP] History Modal
            toggleHistoryModal: (forceClose = false) => {
                const overlay = document.getElementById('history-overlay');
                const box = document.getElementById('history-box');
                const list = document.getElementById('history-list');

                if(forceClose || overlay.classList.contains('active')) {
                    box.classList.remove('active'); setTimeout(() => overlay.classList.remove('active'), 300);
                } else {
                    // Build list
                    if(State.orderHistory.length === 0) {
                        list.innerHTML = `<div class="text-center py-10 opacity-50"><i class="fas fa-box-open text-4xl mb-2"></i><p>Chưa có đơn hàng nào</p></div>`;
                    } else {
                        list.innerHTML = State.orderHistory.slice().reverse().map(o => `
                            <div class="p-3 border border-gray-100 dark:border-gray-800 rounded-2xl bg-white dark:bg-darkCard shadow-sm">
                                <div class="flex justify-between items-center mb-2 border-b border-gray-50 dark:border-gray-800 pb-2">
                                    <span class="text-xs font-bold text-gray-500">${new Date(o.date).toLocaleString('vi-VN')}</span>
                                    <span class="text-xs font-bold text-success bg-green-100 dark:bg-green-900/30 px-2 py-0.5 rounded">Thành công</span>
                                </div>
                                <div class="text-sm font-semibold mb-2 dark:text-gray-300">${o.itemsStr}</div>
                                <div class="flex justify-between items-center mt-2">
                                    <span class="font-bold text-secondary text-lg">${o.total}</span>
                                    <button onclick="CartController.reorder('${o.id}')" class="text-xs bg-primary/20 text-accent font-bold px-3 py-1.5 rounded-lg hover:bg-primary/40 touch-target"><i class="fas fa-redo"></i> Đặt lại</button>
                                </div>
                            </div>
                        `).join('');
                    }
                    overlay.classList.add('active'); setTimeout(() => box.classList.add('active'), 10);
                }
            },

            flyToCartAnim: (btn, iconText) => {
                const rect = btn.getBoundingClientRect();
                const targetRect = document.getElementById('cart-icon-target').getBoundingClientRect();
                const clone = document.createElement('div');
                clone.innerText = iconText; clone.className = 'fixed text-3xl z-[100] pointer-events-none drop-shadow-lg';
                clone.style.left = `${rect.left}px`; clone.style.top = `${rect.top}px`;
                clone.style.setProperty('--tx', `${targetRect.left - rect.left}px`);
                clone.style.setProperty('--ty', `${targetRect.top - rect.top}px`);
                clone.style.animation = 'flyItem 0.6s cubic-bezier(0.2, 1, 0.3, 1) forwards';
                document.body.appendChild(clone); setTimeout(() => clone.remove(), 600);
            },

            // [NÂNG CẤP] Auto fill Form
            loadUserInfo: () => {
                document.getElementById('frm-name').value = State.user.name;
                document.getElementById('frm-phone').value = State.user.phone;
                document.getElementById('frm-notes').value = State.user.address;
            },
            saveUserInfoOnTyping: () => {
                State.user.name = document.getElementById('frm-name').value;
                State.user.phone = document.getElementById('frm-phone').value;
                State.user.address = document.getElementById('frm-notes').value;
                State.saveUser();
            },

            // [NÂNG CẤP] FIX BUGS: Darkmode classList issue
            checkTheme: () => {
                const docClass = document.documentElement.classList;
                if(localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                    docClass.add('dark'); document.getElementById('theme-toggle').innerHTML = '<i class="fas fa-sun"></i>';
                } else {
                    docClass.remove('dark'); document.getElementById('theme-toggle').innerHTML = '<i class="fas fa-moon"></i>';
                }
            },

            setupEvents: () => {
                const container = document.getElementById('menu-container');
                
                const addAction = (btn) => {
                    const variantsStr = btn.dataset.variants;
                    if(variantsStr) {
                        // Mở modal nếu có size
                        UI.openVariantModal(btn.dataset.id, btn.dataset.name, btn.dataset.icon, variantsStr, btn);
                    } else {
                        // Thêm trực tiếp
                        CartController.add(btn.dataset.id, btn.dataset.name, parseFloat(btn.dataset.price), btn.dataset.icon);
                        UI.flyToCartAnim(btn, btn.dataset.icon);
                    }
                };

                // Click event (replaced hold to avoid complex mobile bugs with modals)
                container.addEventListener('click', (e) => {
                    const btn = e.target.closest('.btn-add-item');
                    if(btn) addAction(btn);
                });

                // Tìm kiếm
                document.getElementById('search-input').addEventListener('input', Utils.debounce((e) => {
                    State.searchQuery = e.target.value;
                    UI.renderMenu();
                }, 300));

                // Modals
                document.getElementById('cart-bar-trigger').addEventListener('click', () => UI.toggleCartModal());
                document.getElementById('btn-close-cart').addEventListener('click', UI.closeCartModal);
                document.getElementById('cart-overlay').addEventListener('click', (e) => { if(e.target.id === 'cart-overlay') UI.closeCartModal(); });
                
                // Form interactions -> Auto save
                document.getElementById('frm-name').addEventListener('input', UI.saveUserInfoOnTyping);
                document.getElementById('frm-phone').addEventListener('input', UI.saveUserInfoOnTyping);
                document.getElementById('frm-notes').addEventListener('input', UI.saveUserInfoOnTyping);
                document.getElementById('frm-ship').addEventListener('change', UI.updateCartBar);
                
                // Clear cart
                document.getElementById('btn-clear-cart').addEventListener('click', UI.showConfirmClear);
                document.getElementById('btn-confirm-cancel').addEventListener('click', UI.closeConfirm);
                document.getElementById('btn-confirm-ok').addEventListener('click', () => { CartController.clear(); UI.closeConfirm(); });
                
                // Submit Order
                document.getElementById('btn-submit-order').addEventListener('click', Utils.debounce(APIController.processOrder, 1000));

                // Theme
                document.getElementById('theme-toggle').addEventListener('click', () => {
                    const docClass = document.documentElement.classList;
                    docClass.toggle('dark');
                    const isDark = docClass.contains('dark');
                    localStorage.theme = isDark ? 'dark' : 'light';
                    document.getElementById('theme-toggle').innerHTML = isDark ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
                });

                window.addEventListener('offline', () => { State.isOffline = true; document.getElementById('network-status').classList.add('offline-bar');});
                window.addEventListener('online', () => { State.isOffline = false; document.getElementById('network-status').classList.remove('offline-bar');});
            }
        };

        /** ==========================================
         * MODULE 5: CART LOGIC
         * ========================================== */
        const CartController = {
            add: (id, name, price, icon) => {
                if (State.cart[id]) State.cart[id].qty++;
                else State.cart[id] = { name, price, icon, qty: 1 };
                State.lastAddedId = id; // trigger flash
                State.saveCart(); UI.updateCartBar();
                UI.showToast(`+1 ${name}`);
            },
            updateQty: (id, change) => {
                if(State.cart[id]) {
                    State.cart[id].qty += change;
                    if(State.cart[id].qty <= 0) delete State.cart[id];
                    State.saveCart(); UI.updateCartBar();
                }
            },
            setQty: (id, val) => {
                const num = parseInt(val);
                if(isNaN(num) || num <= 0) delete State.cart[id];
                else State.cart[id].qty = num;
                State.saveCart(); UI.updateCartBar();
            },
            removeItem: (id) => {
                delete State.cart[id];
                State.saveCart(); UI.updateCartBar();
            },
            clear: () => {
                State.clearCart(); UI.updateCartBar(); UI.showToast("Đã xoá giỏ hàng");
            },
            reorder: (orderId) => {
                const order = State.orderHistory.find(o => o.id === orderId);
                if(order && order.cartData) {
                    State.cart = JSON.parse(JSON.stringify(order.cartData)); // Deep copy
                    State.saveCart(); UI.updateCartBar();
                    UI.toggleHistoryModal(true);
                    UI.showToast("Đã thêm đơn cũ vào giỏ!");
                    setTimeout(() => UI.toggleCartModal(), 500);
                }
            }
        };

        /** ==========================================
         * MODULE 6: API & ORDER PROCESSING
         * ========================================== */
        const APIController = {
            processOrder: async () => {
                const nameEl = document.getElementById('frm-name');
                const phoneEl = document.getElementById('frm-phone');
                const notesEl = document.getElementById('frm-notes');
                const shipVal = document.getElementById('frm-ship').value;

                const name = nameEl.value.trim();
                const phone = phoneEl.value.trim();
                const notes = notesEl.value.trim();
                
                // [NÂNG CẤP] VALIDATION CHUẨN
                nameEl.classList.remove('border-red-500'); phoneEl.classList.remove('border-red-500'); notesEl.classList.remove('border-red-500');
                
                if(!name) { nameEl.classList.add('border-red-500'); return UI.showToast("Bắt buộc nhập Tên!", "error"); }
                if(!Utils.validatePhone(phone)) { phoneEl.classList.add('border-red-500'); return UI.showToast("SĐT không hợp lệ (cần 10 số VN)!", "error"); }
                if(shipVal !== "0" && !notes) { notesEl.classList.add('border-red-500'); return UI.showToast("Giao hàng thì cho Sóc xin địa chỉ nha!", "error"); }

                const btnSubmit = document.getElementById('btn-submit-order');
                btnSubmit.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Chờ xíu...`;
                btnSubmit.disabled = true;

                const orderID = Utils.generateOrderID();
                let orderItemsStr = [];
                let totalFood_k = 0;

                for (const id in State.cart) {
                    const c = State.cart[id];
                    orderItemsStr.push(`- ${c.icon} ${c.name} (x${c.qty}) = ${Utils.formatMoney(c.price * c.qty)}`);
                    totalFood_k += c.price * c.qty;
                }

                const sel = document.getElementById('frm-ship');
                const shipName = sel.options[sel.selectedIndex].text.split('(')[0].trim();
                const bShip_k = parseInt(shipVal);
                const fShip_k = totalFood_k >= CONFIG.FREESHIP_THRESHOLD ? 0 : bShip_k;
                const fTotal_k = totalFood_k + fShip_k;

                const itemsStrShort = orderItemsStr.map(s => s.split('=')[0].trim()).join(', '); // For History

                const msgText = 
`📦 MÃ ĐƠN: ${orderID}
---
👤 Khách: ${name}
📞 SĐT: ${phone}
🛵 Giao đến: ${shipName}
📝 Địa chỉ/Ghi chú: ${notes || 'Không'}
---
🛒 MÓN:
${orderItemsStr.join('\n')}
---
💵 Món: ${Utils.formatMoney(totalFood_k)}
🚚 Ship: ${totalFood_k >= CONFIG.FREESHIP_THRESHOLD && bShip_k > 0 ? 'FREESHIP' : Utils.formatMoney(fShip_k)}
💰 TỔNG CỘNG: ${Utils.formatMoney(fTotal_k)}`;

                if(!State.isOffline) {
                    const payload = new URLSearchParams({
                        order_id: orderID, time_iso: Utils.getISO(), status: "Đã gửi",
                        name, phone, address: notes, items: itemsStrShort, total: Utils.formatMoney(fTotal_k)
                    });
                    try { fetch(CONFIG.WEBHOOK_URL, { method: 'POST', mode: 'no-cors', body: payload }); } catch (e) {}
                }

                try {
                    await navigator.clipboard.writeText(msgText);
                    
                    // [NÂNG CẤP] Save History
                    State.orderHistory.push({
                        id: orderID, date: Utils.getISO(), itemsStr: itemsStrShort, total: Utils.formatMoney(fTotal_k), cartData: State.cart
                    });
                    State.saveHistory();

                    State.clearCart(); UI.updateCartBar(); UI.closeCartModal();
                    Utils.playSound('sound-success');
                    
                    UI.showToast("Đã copy đơn! Chuyển qua Messenger...");
                    setTimeout(() => window.open(CONFIG.FB_MESSENGER, '_blank'), 1500);

                } catch (err) {
                    UI.showToast("Copy thất bại, bạn nhớ nhắn món cho quán nhé!", "error");
                    setTimeout(() => window.open(CONFIG.FB_MESSENGER, '_blank'), 2000);
                } finally {
                    btnSubmit.innerHTML = `<span class="flex items-center gap-2"><i class="fab fa-facebook-messenger"></i> Chốt đơn</span> <span class="font-cute text-2xl">${Utils.formatMoney(fTotal_k)}</span>`;
                    btnSubmit.disabled = false;
                }
            }
        };

        window.addEventListener('DOMContentLoaded', UI.init);
    </script>
</body>
</html>
